openapi: 3.0.3
info:
  title: API Compras
  version: 1.0.0
  description: >
    Órdenes de compra y recepciones. Al registrar una recepción, este servicio
    solicita la entrada de existencias a Inventarios; no modifica saldos directamente.
servers:
  - url: /compras
security:
  - bearerAuth: []
paths:
  /ordenes:
    get:
      summary: Listar órdenes de compra
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [BORRADOR, EMITIDA, PARCIAL, RECIBIDA, CANCELADA]
        - name: proveedor_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Órdenes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrdenCompra' }
    post:
      summary: Crear orden de compra en estado BORRADOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdenCompraNueva' }
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdenCompra' }
        '404': { description: Proveedor o producto no existe }
        '422': { description: Datos inválidos }

  /ordenes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Obtener orden con sus detalles y recepciones
      responses:
        '200':
          description: Orden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdenCompra' }
        '404': { description: No existe }

  /ordenes/{id}/emitir:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Emitir orden (BORRADOR → EMITIDA)
      responses:
        '200':
          description: Orden emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdenCompra' }
        '409':
          description: Estado no permite la transición

  /ordenes/{id}/cancelar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Cancelar orden (solo si no tiene recepciones)
      responses:
        '200':
          description: Orden cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdenCompra' }
        '409':
          description: La orden ya tiene recepciones o está recibida

  /ordenes/{id}/recepciones:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Registrar recepción de mercancía
      description: >
        Crea la recepción y solicita a Inventarios una ENTRADA por cada línea recibida,
        con referencia ORDEN_COMPRA. Si la cantidad acumulada cumple lo pedido, la orden pasa a RECIBIDA.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecepcionNueva' }
      responses:
        '201':
          description: Recepción registrada y entrada solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recepcion' }
        '409':
          description: Orden no emitida o cantidad excede lo pendiente
        '502':
          description: Inventarios no respondió; la recepción queda pendiente de reintento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrdenCompraNueva:
      type: object
      required: [proveedor_id, detalles]
      properties:
        proveedor_id: { type: integer }
        detalles:
          type: array
          minItems: 1
          items:
            type: object
            required: [producto_id, cantidad_solicitada, costo_unitario]
            properties:
              producto_id: { type: integer }
              cantidad_solicitada: { type: integer, minimum: 1 }
              costo_unitario: { type: number, format: double }
    OrdenCompra:
      type: object
      properties:
        id: { type: integer }
        numero: { type: string, example: "OC-2026-0001" }
        proveedor_id: { type: integer }
        estado:
          type: string
          enum: [BORRADOR, EMITIDA, PARCIAL, RECIBIDA, CANCELADA]
        total: { type: number }
        fecha_creacion: { type: string, format: date-time }
        detalles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              producto_id: { type: integer }
              cantidad_solicitada: { type: integer }
              cantidad_recibida: { type: integer }
              costo_unitario: { type: number }
              subtotal: { type: number }
    RecepcionNueva:
      type: object
      required: [bodega_id, lineas]
      properties:
        bodega_id: { type: integer, description: "Bodega destino en Inventarios" }
        observaciones: { type: string }
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required: [orden_compra_detalle_id, cantidad_recibida]
            properties:
              orden_compra_detalle_id: { type: integer }
              cantidad_recibida: { type: integer, minimum: 1 }
    Recepcion:
      type: object
      properties:
        id: { type: integer }
        orden_compra_id: { type: integer }
        bodega_id: { type: integer }
        fecha_recepcion: { type: string, format: date-time }
        movimientos_inventario_ids:
          type: array
          items: { type: integer }
