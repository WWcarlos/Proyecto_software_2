openapi: 3.0.3
info:
  title: API Productos
  version: 1.0.0
  description: Catálogo de insumos (productos, categorías y unidades de medida).
servers:
  - url: /productos
security:
  - bearerAuth: []
paths:
  /:
    get:
      summary: Listar productos
      parameters:
        - name: categoria_id
          in: query
          schema: { type: integer }
        - name: q
          in: query
          description: Búsqueda por nombre o SKU
          schema: { type: string }
        - name: proveedor_id
          in: query
          description: Productos que suministra este proveedor
          schema: { type: integer }
        - name: activo
          in: query
          description: true = solo activos, false = solo dados de baja
          schema: { type: boolean }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProductos'
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoNuevo' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: SKU ya existe }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
        '502': { description: Proveedores no disponible }

  /{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Obtener producto por id
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404': { description: No existe }
    put:
      summary: Actualizar producto (parcial; solo cambian los campos enviados)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoActualizar' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: No existe }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      summary: Dar de baja un producto (queda inactivo; se conserva su historial)
      responses:
        '200':
          description: Producto dado de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: No existe }

  /categorias:
    get:
      summary: Listar categorías (árbol o plano)
      parameters:
        - name: padre_id
          in: query
          description: Filtra subcategorías de una categoría padre
          schema: { type: integer }
        - name: activa
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Categoria' }
    post:
      summary: Crear categoría o subcategoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaNueva' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { description: Nombre vacío o categoría padre inexistente }

  /categorias/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Actualizar categoría (nombre y/o padre)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaNueva' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: No existe }
        '422': { description: Nombre vacío, padre inexistente o padre igual a sí misma }
    delete:
      summary: Eliminar categoría (baja lógica, queda inactiva)
      responses:
        '200':
          description: Categoría desactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: No existe }

  /unidades-medida:
    get:
      summary: Listar unidades de medida
      responses:
        '200':
          description: Unidades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnidadMedida' }

components:
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    size:
      name: size
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NoAutorizado:
      description: Token ausente o inválido
    ValidacionFallida:
      description: Datos inválidos
    SinPermiso:
      description: El usuario no tiene el permiso productos.gestionar
  schemas:
    Producto:
      type: object
      properties:
        id: { type: integer, example: 1 }
        sku: { type: string, example: "CAJ-MED-001" }
        nombre: { type: string, example: "Caja mediana" }
        descripcion: { type: string }
        categoria_id: { type: integer }
        unidad_medida_id: { type: integer }
        precio: { type: number, example: 1500.0 }
        proveedor_ids:
          type: array
          items: { type: integer }
          example: [1, 2]
        activo: { type: boolean }
        creado_en: { type: string, format: date-time }
    ProductoNuevo:
      type: object
      required: [sku, nombre, categoria_id, unidad_medida_id]
      properties:
        sku: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        categoria_id: { type: integer }
        unidad_medida_id: { type: integer }
        precio: { type: number, minimum: 0, default: 0 }
        proveedor_ids:
          type: array
          description: Proveedores que suministran el producto (deben existir en el servicio de Proveedores)
          items: { type: integer }
    ProductoActualizar:
      type: object
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        categoria_id: { type: integer }
        unidad_medida_id: { type: integer }
        precio: { type: number, minimum: 0 }
        proveedor_ids:
          type: array
          description: Si se envía, reemplaza la lista de proveedores
          items: { type: integer }
    PaginaProductos:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Producto' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    Categoria:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        padre_id: { type: integer, nullable: true }
        activa: { type: boolean }
    CategoriaNueva:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        padre_id: { type: integer, nullable: true }
    UnidadMedida:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string, example: "UN" }
        nombre: { type: string, example: "Unidad" }
