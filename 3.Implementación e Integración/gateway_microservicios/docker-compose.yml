# Participante 3: API Gateway + Usuarios + Compras (Flask) y el microservicio de Inventarios de tu compañero.
# Cada microservicio tiene su propia base de datos MySQL.
# Los servicios de los otros participantes (productos, proveedores, logistica, analitica) deben agregarse
# a este archivo con esos mismos nombres y escuchando en el puerto 8000.

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8000"          # único puerto expuesto al exterior
    environment:
      USUARIOS_URL: http://usuarios:8000
      COMPRAS_URL: http://compras:8000
      PRODUCTOS_URL: http://productos:8000
      PROVEEDORES_URL: http://proveedores:8000
      INVENTARIOS_URL: http://inventarios:5000   # Inventarios (Flask de tu compañero) escucha en 5000
      LOGISTICA_URL: http://logistica:8000
      ANALITICA_URL: http://analitica:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-mi-token-super-secreto}
    depends_on:
      - usuarios
      - compras
      - inventarios

  # ---------------- Usuarios ----------------
  usuarios:
    build: ./usuarios
    environment:
      DATABASE_URL: mysql+pymysql://usuarios:usuarios@usuarios-db:3306/usuarios?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-desarrollo-0123456789}
      JWT_EXPIRES_SECONDS: "3600"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inventarios.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    depends_on:
      usuarios-db:
        condition: service_healthy

  usuarios-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usuarios
      MYSQL_USER: usuarios
      MYSQL_PASSWORD: usuarios
    volumes:
      - usuarios-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uusuarios -pusuarios --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Compras ----------------
  compras:
    build: ./compras
    environment:
      DATABASE_URL: mysql+pymysql://compras:compras@compras-db:3306/compras?charset=utf8mb4
      PROVEEDORES_URL: http://proveedores:8000
      PRODUCTOS_URL: http://productos:8000
      INVENTARIOS_URL: http://inventarios:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-mi-token-super-secreto}
    depends_on:
      compras-db:
        condition: service_healthy

  compras-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: compras
      MYSQL_USER: compras
      MYSQL_PASSWORD: compras
    volumes:
      - compras-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucompras -pcompras --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Inventarios (código de tu compañero) ----------------
  inventarios:
    build: ./inventarios
    environment:
      DB_HOST: inventarios-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${INVENTARIOS_DB_PASSWORD:-clave}
      DB_NAME: bd_inventarios
      token: ${SERVICE_TOKEN:-mi-token-super-secreto}   # el app.py lee la variable "token"
      ANALITICA_URL: http://analitica:8000
      PRODUCTOS_URL: http://productos:8000
      VALIDAR_PRODUCTO: "false"
    depends_on:
      inventarios-db:
        condition: service_healthy

  inventarios-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${INVENTARIOS_DB_PASSWORD:-clave}
    volumes:
      - inventarios-data:/var/lib/mysql
      - ./inventarios/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # crea bd_inventarios y las tablas
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  usuarios-data:
  compras-data:
  inventarios-data:
