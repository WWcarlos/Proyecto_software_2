# Sistema de Gestión de Inventarios - microservicios (Flask + MySQL)
# Un solo compose: el API Gateway es el ÚNICO servicio que publica un puerto (8080).
# Cada microservicio tiene su propia base de datos MySQL, accesible solo desde su servicio.
#
#   cp .env.example .env     (cambia los valores)
#   docker compose up --build
#
# Docker Compose es apoyo de desarrollo local; la orquestación final del proyecto será con Kubernetes.

x-db: &db
  image: mysql:8.4
  restart: unless-stopped
  networks: [red-interna]

x-svc: &svc
  restart: unless-stopped
  networks: [red-interna]

x-env-comun: &env-comun
  token: ${SERVICE_TOKEN:-mi-token-super-secreto}      # los ms-* leen la variable "token"
  SERVICE_TOKEN: ${SERVICE_TOKEN:-mi-token-super-secreto}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-4}

services:
  # ------------------------------------------------------------ API GATEWAY
  gateway:
    <<: *svc
    build: ./ms-gateway
    container_name: gateway
    ports:
      - "8080:8000"          # único puerto expuesto al exterior
    environment:
      USUARIOS_URL: http://usuarios:8000
      COMPRAS_URL: http://compras:8000
      PRODUCTOS_URL: http://productos:8000
      PROVEEDORES_URL: http://proveedores:8000
      INVENTARIOS_URL: http://inventarios:8000
      LOGISTICA_URL: http://logistica:8000
      ANALITICA_URL: http://analitica:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-mi-token-super-secreto}
    depends_on:
      usuarios: { condition: service_healthy }
      compras: { condition: service_healthy }
      productos: { condition: service_healthy }
      proveedores: { condition: service_healthy }
      inventarios: { condition: service_healthy }
      logistica: { condition: service_healthy }
      analitica: { condition: service_healthy }

  # ------------------------------------------------------------ USUARIOS
  usuarios:
    <<: *svc
    build: ./ms-usuarios
    container_name: usuarios
    environment:
      DATABASE_URL: mysql+pymysql://usuarios:usuarios@usuarios-db:3306/usuarios?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-desarrollo-0123456789}
      JWT_EXPIRES_SECONDS: "3600"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inventarios.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    depends_on:
      usuarios-db: { condition: service_healthy }
    healthcheck: &hc-py
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  usuarios-db:
    <<: *db
    container_name: usuarios-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      MYSQL_DATABASE: usuarios
      MYSQL_USER: usuarios
      MYSQL_PASSWORD: usuarios
    volumes:
      - usuarios-data:/var/lib/mysql
    healthcheck: &hc-db
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------ COMPRAS
  compras:
    <<: *svc
    build: ./ms-compras
    container_name: compras
    environment:
      DATABASE_URL: mysql+pymysql://compras:compras@compras-db:3306/compras?charset=utf8mb4
      PROVEEDORES_URL: http://proveedores:8000
      PRODUCTOS_URL: http://productos:8000
      INVENTARIOS_URL: http://inventarios:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-mi-token-super-secreto}
    depends_on:
      compras-db: { condition: service_healthy }
    healthcheck: *hc-py

  compras-db:
    <<: *db
    container_name: compras-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      MYSQL_DATABASE: compras
      MYSQL_USER: compras
      MYSQL_PASSWORD: compras
    volumes:
      - compras-data:/var/lib/mysql
    healthcheck: *hc-db

  # ------------------------------------------------------------ PRODUCTOS
  productos:
    <<: *svc
    build: ./ms-productos
    container_name: productos
    environment:
      <<: *env-comun
      DB_HOST: productos-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      DB_NAME: bd_productos
    depends_on:
      productos-db: { condition: service_healthy }
    healthcheck: *hc-py

  productos-db:
    <<: *db
    container_name: productos-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
    volumes:
      - ./ms-productos/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - productos-data:/var/lib/mysql
    healthcheck: *hc-db

  # ------------------------------------------------------------ PROVEEDORES
  proveedores:
    <<: *svc
    build: ./ms-proveedores
    container_name: proveedores
    environment:
      <<: *env-comun
      DB_HOST: proveedores-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      DB_NAME: bd_proveedores
    depends_on:
      proveedores-db: { condition: service_healthy }
    healthcheck: *hc-py

  proveedores-db:
    <<: *db
    container_name: proveedores-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
    volumes:
      - ./ms-proveedores/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - proveedores-data:/var/lib/mysql
    healthcheck: *hc-db

  # ------------------------------------------------------------ INVENTARIOS
  inventarios:
    <<: *svc
    build: ./ms-inventarios
    container_name: inventarios
    environment:
      <<: *env-comun
      DB_HOST: inventarios-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      DB_NAME: bd_inventarios
      ANALITICA_URL: http://analitica:8000
      PRODUCTOS_URL: http://productos:8000
      VALIDAR_PRODUCTO: "true"      # valida contra Productos que el producto exista
    depends_on:
      inventarios-db: { condition: service_healthy }
    healthcheck: *hc-py

  inventarios-db:
    <<: *db
    container_name: inventarios-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
    volumes:
      - ./ms-inventarios/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - inventarios-data:/var/lib/mysql
    healthcheck: *hc-db

  # ------------------------------------------------------------ LOGÍSTICA
  logistica:
    <<: *svc
    build: ./ms-logistica
    container_name: logistica
    environment:
      <<: *env-comun
      DB_HOST: logistica-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      DB_NAME: bd_logistica
      INVENTARIOS_MODE: http         # integración real con Inventarios (antes: stub)
      INVENTARIOS_URL: http://inventarios:8000
    depends_on:
      logistica-db: { condition: service_healthy }
    healthcheck: *hc-py

  logistica-db:
    <<: *db
    container_name: logistica-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
    volumes:
      - ./ms-logistica/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - logistica-data:/var/lib/mysql
    healthcheck: *hc-db

  # ------------------------------------------------------------ ANALÍTICA
  analitica:
    <<: *svc
    build: ./ms-analitica
    container_name: analitica
    environment:
      <<: *env-comun
      DB_HOST: analitica-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
      DB_NAME: bd_analitica
    depends_on:
      analitica-db: { condition: service_healthy }
    healthcheck: *hc-py

  analitica-db:
    <<: *db
    container_name: analitica-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clave}
    volumes:
      - ./ms-analitica/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - analitica-data:/var/lib/mysql
    healthcheck: *hc-db

volumes:
  usuarios-data:
  compras-data:
  productos-data:
  proveedores-data:
  inventarios-data:
  logistica-data:
  analitica-data:

networks:
  red-interna:
    driver: bridge
